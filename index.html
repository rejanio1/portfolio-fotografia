<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rejânio Mendes Lopes Júnior — Fine Art Photography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&family=Baskervville:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030303;
            --surface: #0e0e0e;
            --text-main: #f3f3f3;
            --text-muted: #666;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar Minimalista */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(3,3,3,0.95) 0%, rgba(3,3,3,0) 100%);
            pointer-events: none;
        }

        header > * { pointer-events: auto; }

        .brand h1 {
            font-family: 'Baskervville', serif;
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .menu-controls {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-btn, .contact-trigger {
            background: none;
            border: none;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.3s ease;
            position: relative;
        }

        .nav-btn:hover, .contact-trigger:hover { opacity: 0.5; }

        /* --- MODO CINEMA PRINCIPAL --- */
        #cinema-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #cinema-view.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .stage {
            width: 80vw;
            height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .stage img {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* HUD Técnico de Informações */
        .artwork-hud {
            position: absolute;
            bottom: 12vh;
            width: 80vw;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .hud-title {
            color: var(--text-main);
            font-family: 'Baskervville', serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: none;
            margin-bottom: 4px;
        }

        /* Filmstrip (Carrossel de Miniaturas Inferior) */
        .filmstrip {
            position: absolute;
            bottom: 2vh;
            width: 80vw;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .filmstrip::-webkit-scrollbar { display: none; }

        .film-thumb {
            min-width: 60px;
            height: 40px;
            background: #111;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            overflow: hidden;
        }

        .film-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .film-thumb.active {
            opacity: 1;
            border-color: #fff;
            transform: scale(1.05);
        }

        /* Setas de Navegação Laterais */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-60%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 2rem;
            cursor: pointer;
            padding: 2rem;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .arrow:hover { color: #fff; }
        #prev-btn { left: 3vw; }
        #next-btn { right: 3vw; }

        /* --- MODO GRID EDITORIAL --- */
        #archive-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            padding: 9rem 4rem 4rem 4rem;
            background-color: var(--bg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #archive-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1500px;
            margin: 0 auto;
        }

        .archive-card {
            background: var(--surface);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            aspect-ratio: 4/3;
            border: 1px solid var(--border);
        }

        .archive-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85);
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
        }

        .archive-card:hover img {
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        /* --- MODAL DE CONTATO / AQUISIÇÃO --- */
        #contact-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #contact-modal.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .modal-box h2 {
            font-family: 'Baskervville', serif;
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .modal-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .close-modal {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            background: none; border: none; color: #fff;
            font-size: 1.5rem; cursor: pointer;
        }

        .btn-submit {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            background: #fff;
            color: #000;
            border: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover { background: #d4d4d4; }

        /* Responsividade */
        @media (max-width: 768px) {
            header { padding: 1.5rem 2rem; }
            .stage { width: 90vw; height: 50vh; }
            .artwork-hud { width: 90vw; bottom: 14vh; }
            .filmstrip { width: 90vw; }
            #archive-view { padding: 7rem 1.5rem 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Rejânio Mendes</h1>
        </div>
        <div class="menu-controls">
            <button class="nav-btn" id="view-toggle">Índice (77)</button>
            <button class="contact-trigger" id="contact-open">Contato / Adquirir</button>
        </div>

    <!-- MODO CINEMA -->
    <div id="cinema-view">

        <button class="arrow" id="next-btn">&#10095;</button>

        <div class="stage">

        <div class="artwork-hud">
            <div>

                <span id="art-specs">Sony A7R II • Alta Resolução</span>
            </div>
            <div id="art-counter" style="font-weight: 500; color: #fff;">01 / 77</div>
        </div>

        <div class="filmstrip" id="filmstrip-container">
            <!-- Miniaturas geradas dinamicamente -->
        </div>
    </div>

    <!-- MODO GRID EDITORIAL -->
    <div id="archive-view">
        <div class="archive-grid" id="grid-container">
            <!-- Cards injetados via JS -->
        </div>
    </div>

    <!-- MODAL DE CONTATO -->
    <div id="contact-modal">

            <a href="mailto:rejaniolopes@gmail.com" class="btn-submit">Enviar E-mail Direto</a>
        </div>
    </div>

        let currentIndex = 0;
        let isArchiveOpen = false;

        const mainImage = document.getElementById('main-image');
        const artCounter = document.getElementById('art-counter');
        const artTitle = document.getElementById('art-title');
        const cinemaView = document.getElementById('cinema-view');
        const archiveView = document.getElementById('archive-view');
        const viewToggle = document.getElementById('view-toggle');
        const gridContainer = document.getElementById('grid-container');
        const filmstripContainer = document.getElementById('filmstrip-container');
        
        const contactModal = document.getElementById('contact-modal');
        document.getElementById('contact-open').addEventListener('click', () => contactModal.classList.add('active'));
        document.getElementById('contact-close').addEventListener('click', () => contactModal.classList.remove('active'));

        function initApp() {
            // Gerar Grid
            photoIds.forEach((id, index) => {
                const card = document.createElement('div');
                card.className = 'archive-card';
                card.innerHTML = `<img src="https://drive.google.com/thumbnail?id=${id}&sz=w600" loading="lazy" alt="Obra ${index + 1}">`;
                card.addEventListener('click', () => {
                    currentIndex = index;
                    updateCinemaView();
                    toggleView();
                });
                gridContainer.appendChild(card);

                // Gerar Filmstrip
                const thumb = document.createElement('div');
                thumb.className = `film-thumb ${index === 0 ? 'active' : ''}`;
                thumb.id = `thumb-${index}`;
                thumb.innerHTML = `<img src="https://drive.google.com/thumbnail?id=${id}&sz=w200" loading="lazy">`;
                thumb.addEventListener('click', () => {
                    currentIndex = index;
                    updateCinemaView();
                });
                filmstripContainer.appendChild(thumb);
            });
        }

        function updateCinemaView() {
            const id = photoIds[currentIndex];
            mainImage.src = `https://drive.google.com/thumbnail?id=${id}&sz=w1920`;
            artCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${photoIds.length}`;
            artTitle.textContent = `Fine Art Piece No. ${currentIndex + 1}`;

            // Atualizar destaque na filmstrip
            document.querySelectorAll('.film-thumb').forEach((el, idx) => {
                if (idx === currentIndex) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % photoIds.length;
            updateCinemaView();
        }

        function prevPhoto() {
            currentIndex = (currentIndex - 1 + photoIds.length) % photoIds.length;
            updateCinemaView();
        }

        function toggleView() {
            isArchiveOpen = !isArchiveOpen;
            if (isArchiveOpen) {
                archiveView.classList.add('active');
                cinemaView.classList.add('hidden');
                viewToggle.textContent = 'Modo Cinema';
            } else {
                archiveView.classList.remove('active');
                cinemaView.classList.remove('hidden');
                viewToggle.textContent = `Índice (${photoIds.length})`;
            }
        }

        document.getElementById('next-btn').addEventListener('click', nextPhoto);
        document.getElementById('prev-btn').addEventListener('click', prevPhoto);
        viewToggle.addEventListener('click', toggleView);

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (isArchiveOpen || contactModal.classList.contains('active')) return;
            if (e.key === 'ArrowRight' || e.key === ' ') nextPhoto();
            if (e.key === 'ArrowLeft') prevPhoto();
        });

        initApp();
        updateCinemaView();
    </script>
