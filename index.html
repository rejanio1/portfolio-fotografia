<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Rejânio Mendes Lopes Júnior — Fine Art Photography</title>
    
    <!-- Tipografia de Luxo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --text-primary: #ededed;
            --text-secondary: #777;
            --accent: #d4d4d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar / Menu */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(5,5,5,0.9) 0%, rgba(5,5,5,0) 100%);
            pointer-events: none;
        }

        header > * {
            pointer-events: auto;
        }

        .brand h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .menu-controls {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-btn, .contact-link {
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-btn::after, .contact-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--text-primary);
            transition: width 0.3s ease;
        }

        .nav-btn:hover::after, .contact-link:hover::after {
            width: 100%;
        }

        /* --- MODO CINEMA (IMERSIVO) --- */
        #cinema-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #cinema-view.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .stage {
            max-width: 85vw;
            max-height: 72vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .stage img {
            max-width: 100%;
            max-height: 72vh;
            object-fit: contain;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            user-select: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .artwork-meta {
            position: absolute;
            bottom: 4rem;
            width: 85vw;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .artwork-title {
            color: var(--text-primary);
            font-weight: 500;
        }

        .nav-arrows {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 94vw;
            left: 3vw;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .arrow {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .arrow:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        /* --- MODO ARQUIVO / GRID EDITORIAL --- */
        #archive-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            padding: 8rem 4rem 4rem 4rem;
            background-color: var(--bg-color);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #archive-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .archive-item {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background: #111;
            aspect-ratio: 4/3;
        }

        .archive-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
        }

        .archive-item:hover img {
            transform: scale(1.04);
            filter: brightness(1.1);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            header { padding: 1.5rem 2rem; }
            .archive-grid { grid-template-columns: 1fr; gap: 1rem; }
            #archive-view { padding: 6rem 1.5rem 2rem 1.5rem; }
            .artwork-meta { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Rejânio Mendes</h1>
        </div>
        <div class="menu-controls">
            <button class="nav-btn" id="view-toggle">Índice (77)</button>
            <a href="mailto:rejaniolopes@gmail.com" class="contact-link">Contato</a>
        </div>
    </header>

    <!-- MODO CINEMA -->
    <div id="cinema-view">
        <div class="nav-arrows">
            <button class="arrow" id="prev-btn">&#10094;</button>
            <button class="arrow" id="next-btn">&#10095;</button>
        </div>
        <div class="stage">
            <img id="main-image" src="" alt="Fine Art Photography">
        </div>
        <div class="artwork-meta">
            <div>
                <span class="artwork-title" id="art-title">Fine Art Landscape</span>
                <p style="margin-top: 4px; font-size: 0.65rem; opacity: 0.5;">Sony A7R II</p>
            </div>
            <div id="art-counter">01 / 77</div>
        </div>
    </div>

    <!-- MODO ARQUIVO (GRID) -->
    <div id="archive-view">

        let currentIndex = 0;
        let isArchiveOpen = false;

        const mainImage = document.getElementById('main-image');
        const artCounter = document.getElementById('art-counter');
        const artTitle = document.getElementById('art-title');
        const cinemaView = document.getElementById('cinema-view');
        const archiveView = document.getElementById('archive-view');
        const viewToggle = document.getElementById('view-toggle');
        const gridContainer = document.getElementById('grid-container');

        // Inicializar a Galeria Grid
        function initGrid() {
            photoIds.forEach((id, index) => {
                const item = document.createElement('div');
                item.className = 'archive-item';
                item.innerHTML = `<img src="https://drive.google.com/thumbnail?id=${id}&sz=w800" loading="lazy" alt="Obra ${index + 1}">`;
                item.addEventListener('click', () => {
                    currentIndex = index;
                    updateCinemaView();
                    toggleView();
                });
                gridContainer.appendChild(item);
            });
        }

        function updateCinemaView() {
            const id = photoIds[currentIndex];
            mainImage.src = `https://drive.google.com/thumbnail?id=${id}&sz=w1920`;
            artCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${photoIds.length}`;
            artTitle.textContent = `Fine Art Collection — Peça ${currentIndex + 1}`;
        }

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % photoIds.length;
            updateCinemaView();
        }

        function prevPhoto() {
            currentIndex = (currentIndex - 1 + photoIds.length) % photoIds.length;
            updateCinemaView();
        }

        function toggleView() {
            isArchiveOpen = !isArchiveOpen;
            if (isArchiveOpen) {
                archiveView.classList.add('active');
                cinemaView.classList.add('hidden');
                viewToggle.textContent = 'Modo Cinema';
            } else {
                archiveView.classList.remove('active');
                cinemaView.classList.remove('hidden');
                viewToggle.textContent = `Índice (${photoIds.length})`;
            }
        }

        // Event Listeners
        document.getElementById('next-btn').addEventListener('click', nextPhoto);
        document.getElementById('prev-btn').addEventListener('click', prevPhoto);
        viewToggle.addEventListener('click', toggleView);

        // Navegação por teclado (Setas e Espaço)
        document.addEventListener('keydown', (e) => {
            if (isArchiveOpen) return;
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextPhoto();
            } else if (e.key === 'ArrowLeft') {
                prevPhoto();
            }
        });

        // Inicialização
        updateCinemaView();
        initGrid();
