    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #f4f4f4;
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Header Elegante */
        header {
            text-align: center;
            padding: 5rem 2rem 3rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        header p {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
        }

        nav {
            margin-top: 2rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: 0.3s;
        }

        nav a:hover {
            border-bottom: 1px solid #fff;
            color: #b3b3b3;
        }

        /* Grid Masonry estilo Kyulo */
        .gallery-container {
            padding: 4rem 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .masonry {
            column-count: 3;
            column-gap: 1.5rem;
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            background-color: #1a1a1a; /* Fundo enquanto carrega */
        }

        .masonry-item img {
            width: 100%;
            display: block;
            transition: transform 0.6s ease, filter 0.6s ease;
            filter: brightness(0.9) grayscale(10%);
        }

        .masonry-item:hover img {
            transform: scale(1.03);
            filter: brightness(1.1) grayscale(0%);
        }

        /* Lightbox (Visualizador em Tela Cheia) */
        #lightbox {
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90vh;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 2px;
        }

        #lightbox .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 30px;
            font-family: sans-serif;
            cursor: pointer;
            font-weight: 300;
        }

        /* Responsividade */
        @media (max-width: 1024px) {
            .masonry { column-count: 2; }
        }
        @media (max-width: 600px) {
            .masonry { column-count: 1; }
            header h1 { font-size: 1.8rem; }
        }
    </style>

    <!-- Container do Lightbox oculto por padrão -->
    <div id="lightbox">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Imagem Ampliada">
    </div>

    <!-- Script de Interação para abrir as fotos -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.querySelector('.close-btn');
        const items = document.querySelectorAll('.masonry-item img');

        // Abrir lightbox ao clicar na imagem
        items.forEach(item => {
            item.addEventListener('click', () => {
                lightbox.classList.add('active');
                // Puxa a versão em altíssima resolução (w2000) para a tela cheia
                lightboxImg.src = item.src.replace('w1000', 'w2000');
            });
        });

        // Fechar no X
        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        // Fechar clicando fora da imagem
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });
    </script>
